name: Paperclip TI-0093 - isolation preflight v2

# DIAGNOSTIC ONLY.  This workflow never downloads, installs or executes
# Paperclip.  It has no automatic trigger and deliberately uses no actions.
on:
  workflow_dispatch:

# No repository-content, issue, package, deployment or OIDC permission.
# GitHub may still report its unavoidable Metadata: read capability.
permissions: {}

concurrency:
  group: paperclip-ti-0093-preflight-v2
  cancel-in-progress: false

jobs:
  isolation-preflight:
    # No jobs.container: Actions injects docker.sock and runner bind mounts
    # into job containers before steps begin.  This trusted host script creates
    # the diagnostic container itself with no --mount or --volume arguments.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Fail-closed Docker isolation diagnostic (no Paperclip)
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          # This shell runs on the GitHub-hosted runner and is trusted only as
          # infrastructure.  No third-party source or script is invoked here.
          # Mandatory controls gate container start.  Diagnostic findings are
          # fail-closed for the final verdict, but may be collected at runtime
          # when all mandatory pre-start controls have passed.
          hard_prestart_failures=()
          diagnostic_findings=()
          container_id=''
          diagnostic_log=''
          fail() { hard_prestart_failures+=("$1"); printf 'NO-GO %s\n' "$1"; }
          diagnostic_no_go() { diagnostic_findings+=("$1"); printf 'DIAGNOSTIC-NO-GO %s\n' "$1"; }
          pass() { printf 'PASS %s\n' "$1"; }
          info() { printf 'INFO %s\n' "$1"; }
          # PREFLIGHT_DECISION_HELPERS_BEGIN
          runtime_collection_permitted() { (( ${#hard_prestart_failures[@]} == 0 )); }
          final_verdict_is_go() { (( ${#hard_prestart_failures[@]} == 0 && ${#diagnostic_findings[@]} == 0 )); }
          # PREFLIGHT_DECISION_HELPERS_END
          cleanup() {
            if [[ -n "$container_id" ]]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            [[ -z "$diagnostic_log" ]] || rm -f "$diagnostic_log"
          }
          trap cleanup EXIT

          # Never print the environment.  A value here is a hard failure;
          # nothing from this host environment is passed to docker run/create.
          for name in GITHUB_TOKEN GH_TOKEN GH_PAT CI_TOKEN \
                      ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN \
                      AWS_ACCESS_KEY_ID GOOGLE_APPLICATION_CREDENTIALS \
                      AZURE_CLIENT_SECRET OPENAI_API_KEY ANTHROPIC_API_KEY; do
            [[ -z "${!name:-}" ]] || fail "credential-like host environment variable present: $name"
          done

          # No checkout action is used.  A populated workspace would be an
          # unexpected source exposure and blocks this diagnostic.
          workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE must be defined}"
          if [[ -e "$workspace/.git" || -e "$workspace/package.json" || -e "$workspace/pnpm-lock.yaml" ]]; then
            fail 'workspace is not source-free'
          else
            pass 'workspace has no checked-out source'
          fi

          command -v docker >/dev/null 2>&1 || fail 'Docker client unavailable on runner'
          if runtime_collection_permitted; then
            docker version --format '{{.Server.APIVersion}}' >/dev/null 2>&1 || fail 'Docker daemon unavailable on runner'
          fi

          # Digest copied from the publisher’s GHCR package page.  It is a
          # public diagnostic image; it is not Paperclip and carries no user
          # data.  Its Dockerfile includes bash, openssl, curl, iproute2 and nc.
          image='ghcr.io/nicolaka/netshoot:v0.16@sha256:147f2c4cb0aa7a741151bce2bfef71d9e1a04631636e24665ee2a5ed799feb47'
          expected_digest="${image##*@}"

          if runtime_collection_permitted; then
            # Image acquisition is the only intentional runner egress.  It is
            # completed before the isolated diagnostic starts.
            docker pull "$image" >/dev/null 2>&1 || fail 'cannot pull pinned public diagnostic image'
          fi
          if runtime_collection_permitted; then
            docker image inspect "$image" --format '{{join .RepoDigests "\n"}}' | \
              grep -Fq "@$expected_digest" || fail 'pulled image does not retain expected digest'
          fi

          if runtime_collection_permitted; then
            # No --mount, --volume, --env-file, --privileged, --pid=host,
            # --ipc=host or --userns=host.  The two tmpfs mounts are explicit,
            # bounded scratch space; the root filesystem is read-only.
            set +e
            container_id="$(docker create \
              --network none \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              --tmpfs /run:rw,noexec,nosuid,size=8m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --pids-limit 128 \
              --memory 512m \
              --cpus 1 \
              --user 10001:10001 \
              --interactive \
              --workdir /tmp \
              --entrypoint /bin/bash \
              "$image" -s 2>/dev/null)"
            create_rc=$?
            set -e
            if (( create_rc != 0 )) || [[ -z "$container_id" ]]; then
              fail 'Docker could not create the isolated diagnostic container'
            fi
          fi

          if [[ -n "$container_id" ]]; then
            # Every inspect failure is a NO-GO; never interpret a missing value
            # as a secure default.
            inspect_value() { docker inspect --format "$1" "$container_id"; }
            inspect_exact() {
              local label="$1" expected="$2" template="$3" actual
              if ! actual="$(inspect_value "$template")"; then
                fail "docker inspect failed for $label"
              elif [[ "$actual" != "$expected" ]]; then
                fail "$label has unexpected value: $actual"
              fi
            }
            inspect_empty_collection() {
              local label="$1" template="$2" actual
              if ! actual="$(inspect_value "$template")"; then
                fail "docker inspect failed for $label"
              elif [[ "$actual" != 'null' && "$actual" != '[]' && "$actual" != '{}' && "$actual" != '<no value>' ]]; then
                fail "$label is unexpectedly populated"
              fi
            }
            inspect_not_host() {
              local label="$1" template="$2" actual
              if ! actual="$(inspect_value "$template")"; then
                fail "docker inspect failed for $label"
              elif [[ "$actual" == host ]]; then
                fail "$label is host"
              fi
            }
            inspect_contains() {
              local label="$1" needle="$2" template="$3" actual
              if ! actual="$(inspect_value "$template")"; then
                fail "docker inspect failed for $label"
              elif [[ "$actual" != *"$needle"* ]]; then
                fail "$label does not contain required value"
              fi
            }

            # TMPFS_VALIDATOR_BEGIN
            normalize_tmpfs_size() {
              local raw="${1,,}" expected_bytes="$2" number unit expected_value
              if [[ ! "$raw" =~ ^([0-9]+)(b|k|kb|ki|kib|m|mb|mi|mib)?$ ]]; then
                return 2
              fi
              number="${BASH_REMATCH[1]}"
              unit="${BASH_REMATCH[2]:-b}"
              case "$unit" in
                b) expected_value="$expected_bytes" ;;
                k|kb|ki|kib) expected_value="$(( expected_bytes / 1024 ))" ;;
                m|mb|mi|mib) expected_value="$(( expected_bytes / 1048576 ))" ;;
                *) return 2 ;;
              esac
              [[ "$number" == "$expected_value" ]] || return 1
              printf '%s\n' "$expected_bytes"
            }

            validate_tmpfs_config() {
              local entries="$1" path options extra expected_bytes token size_raw size_bytes tmpfs_key
              local tmp_seen=0 run_seen=0 unexpected_keys=0 invalid=0 parse_error=0
              local rw_seen=0 noexec_seen=0 nosuid_seen=0 size_seen=0
              while IFS='|' read -r path options extra; do
                [[ -z "$path" && -z "$options" && -z "$extra" ]] && continue
                if [[ -z "$path" || -z "$options" || -n "$extra" ]]; then
                  parse_error=1
                  continue
                fi
                case "$path" in
                  /tmp) expected_bytes=67108864; tmpfs_key=tmp; (( ++tmp_seen )) ;;
                  /run) expected_bytes=8388608; tmpfs_key=run; (( ++run_seen )) ;;
                  *) expected_bytes=''; tmpfs_key=unexpected; (( ++unexpected_keys )) ;;
                esac
                if [[ "$options" == *, || "$options" == *',,'* ]]; then
                  parse_error=1
                  printf 'tmpfs_key=%s state=invalid\n' "$tmpfs_key"
                  continue
                fi
                [[ "$tmpfs_key" != unexpected ]] || continue
                if (( tmp_seen > 1 || run_seen > 1 )); then
                  invalid=1
                  continue
                fi
                rw_seen=0; noexec_seen=0; nosuid_seen=0; size_seen=0; size_bytes=''
                IFS=',' read -r -a tmpfs_tokens <<< "$options"
                for token in "${tmpfs_tokens[@]}"; do
                  case "$token" in
                    rw) (( ++rw_seen )) ;;
                    noexec) (( ++noexec_seen )) ;;
                    nosuid) (( ++nosuid_seen )) ;;
                    size=*)
                      (( ++size_seen ))
                      size_raw="${token#size=}"
                      if ! size_bytes="$(normalize_tmpfs_size "$size_raw" "$expected_bytes")"; then
                        invalid=1
                      fi
                      ;;
                    *) invalid=1 ;;
                  esac
                done
                if (( rw_seen != 1 || noexec_seen != 1 || nosuid_seen != 1 || size_seen != 1 )); then
                  invalid=1
                fi
                # Only sanitized, expected keys and normalized sizes are emitted.
                if [[ -n "$size_bytes" && "$size_bytes" == "$expected_bytes" && "$rw_seen" == 1 && "$noexec_seen" == 1 && "$nosuid_seen" == 1 ]]; then
                  printf 'tmpfs_key=%s flags=rw,noexec,nosuid size_bytes=%s\n' "$path" "$size_bytes"
                else
                  printf 'tmpfs_key=%s state=invalid\n' "$path"
                fi
              done <<< "$entries"
              (( tmp_seen != 0 )) || printf '%s\n' 'tmpfs_key=/tmp state=missing'
              (( run_seen != 0 )) || printf '%s\n' 'tmpfs_key=/run state=missing'
              printf 'tmpfs_unexpected_key_count=%s\n' "$unexpected_keys"
              if (( parse_error != 0 )); then
                printf '%s\n' 'tmpfs_parser_error'
                return 2
              fi
              (( tmp_seen == 1 && run_seen == 1 && unexpected_keys == 0 && invalid == 0 )) || return 1
              return 0
            }

            validate_inspected_tmpfs() {
              local entries
              if ! entries="$(inspect_value '{{range $k,$v := .HostConfig.Tmpfs}}{{printf "%s|%s\n" $k $v}}{{end}}')"; then
                printf '%s\n' 'tmpfs_inspect_error'
                return 2
              fi
              validate_tmpfs_config "$entries"
            }
            # TMPFS_VALIDATOR_END

            # Validate Docker’s effective configuration before starting it.
            inspect_exact network_mode none '{{.HostConfig.NetworkMode}}'
            inspect_exact readonly_rootfs true '{{.HostConfig.ReadonlyRootfs}}'
            inspect_exact container_user 10001:10001 '{{.Config.User}}'
            inspect_exact open_stdin true '{{.Config.OpenStdin}}'
            inspect_exact privileged false '{{.HostConfig.Privileged}}'
            inspect_exact memory_bytes 536870912 '{{.HostConfig.Memory}}'
            inspect_exact pids_limit 128 '{{.HostConfig.PidsLimit}}'
            inspect_exact nano_cpus 1000000000 '{{.HostConfig.NanoCpus}}'
            inspect_not_host pid_mode '{{.HostConfig.PidMode}}'
            inspect_not_host ipc_mode '{{.HostConfig.IpcMode}}'
            inspect_not_host uts_mode '{{.HostConfig.UTSMode}}'
            inspect_empty_collection host_binds '{{json .HostConfig.Binds}}'
            inspect_empty_collection volumes_from '{{json .HostConfig.VolumesFrom}}'
            inspect_empty_collection host_mounts '{{json .HostConfig.Mounts}}'
            inspect_empty_collection image_declared_volumes '{{json .Config.Volumes}}'
            inspect_contains cap_drop ALL '{{json .HostConfig.CapDrop}}'
            inspect_contains security_opt no-new-privileges '{{json .HostConfig.SecurityOpt}}'

            set +e
            tmpfs_diagnostic="$(validate_inspected_tmpfs)"
            tmpfs_rc=$?
            set -e
            while IFS= read -r tmpfs_line; do
              [[ -n "$tmpfs_line" ]] && info "$tmpfs_line"
            done <<< "$tmpfs_diagnostic"
            case "$tmpfs_rc" in
              0) pass 'tmpfs configuration matches semantic closed allowlist' ;;
              1) fail 'tmpfs configuration violates semantic closed allowlist' ;;
              *) fail 'docker inspect or tmpfs parser failed' ;;
            esac

            # Docker's .Mounts is a report, not the declared configuration, and
            # its entries vary by Docker version and lifecycle state.  Check it
            # independently without assuming a fixed count; the closed runtime
            # allowlist below remains the authoritative observation.
            # DOCKER_REPORTED_MOUNTS_VALIDATOR_BEGIN
            validate_docker_reported_mounts() {
              local entries="$1" mount_type mount_destination mount_rw extra
              local unexpected=0 parse_error=0
              while IFS='|' read -r mount_type mount_destination mount_rw extra; do
                [[ -z "$mount_type" && -z "$mount_destination" && -z "$mount_rw" && -z "$extra" ]] && continue
                if [[ -z "$mount_type" || -z "$mount_destination" || -z "$mount_rw" || -n "$extra" ]]; then
                  parse_error=1
                  continue
                fi
                case "$mount_type|$mount_destination|$mount_rw" in
                  'tmpfs|/tmp|true'|'tmpfs|/run|true'|\
                  'bind|/etc/hosts|true'|'bind|/etc/hostname|true'|'bind|/etc/resolv.conf|true') ;;
                  *) (( ++unexpected )) ;;
                esac
              done <<< "$entries"
              printf 'docker_reported_mount_unexpected_count=%s\n' "$unexpected"
              if (( parse_error != 0 )); then
                printf '%s\n' 'docker_reported_mount_parser_error'
                return 2
              fi
              (( unexpected == 0 )) || return 1
              return 0
            }
            # DOCKER_REPORTED_MOUNTS_VALIDATOR_END
            # DOCKER_SPECIAL_FILES_DIAGNOSTIC_BEGIN
            # This is diagnostic evidence only.  It does not relax the
            # independent Docker configuration or runtime mount allowlists.
            # Raw paths and sources remain in local shell variables and are
            # never written to the public workflow log.
            # DOCKER_SPECIAL_CORRELATION_RESULT_BEGIN
            record_docker_special_correlation_result() {
              case "$1" in
                inspect_error) diagnostic_no_go 'docker special-file diagnostic inspect inconclusive' ;;
                0) info 'docker special-file correlation diagnostic complete; not a runtime authorization' ;;
                1) diagnostic_no_go 'docker special-file correlation incomplete or unexpected' ;;
                *) diagnostic_no_go 'docker special-file diagnostic parser inconclusive' ;;
              esac
            }
            # DOCKER_SPECIAL_CORRELATION_RESULT_END
            diagnose_docker_special_files() {
              local entries="$1" hosts_path="$2" hostname_path="$3" resolv_path="$4" readonly_rootfs="$5"
              local destination mount_type mount_rw mount_source extra expected_source id
              local hosts_seen=0 hostname_seen=0 resolv_seen=0 unexpected=0 malformed=0 invalid=0
              local hosts_type=false hosts_present=false hosts_match=false hosts_rw=unknown
              local hostname_type=false hostname_present=false hostname_match=false hostname_rw=unknown
              local resolv_type=false resolv_present=false resolv_match=false resolv_rw=unknown
              # The template is expected to produce a boolean.  Do not log or
              # trust another value as secure metadata.
              if [[ "$readonly_rootfs" != true && "$readonly_rootfs" != false ]]; then
                printf '%s\n' 'docker_special_file_parser_error'
                return 2
              fi
              while IFS='|' read -r destination mount_type mount_rw mount_source extra; do
                [[ -z "$destination" && -z "$mount_type" && -z "$mount_rw" && -z "$mount_source" && -z "$extra" ]] && continue
                if [[ -z "$destination" || -z "$mount_type" || -z "$mount_rw" || -z "$mount_source" || -n "$extra" ]]; then
                  malformed=1
                  continue
                fi
                case "$destination" in
                  /etc/hosts) id=etc_hosts; expected_source="$hosts_path"; (( ++hosts_seen )) ;;
                  /etc/hostname) id=etc_hostname; expected_source="$hostname_path"; (( ++hostname_seen )) ;;
                  /etc/resolv.conf) id=etc_resolv_conf; expected_source="$resolv_path"; (( ++resolv_seen )) ;;
                  /tmp|/run) continue ;;
                  *) (( ++unexpected )); continue ;;
                esac
                if [[ "$mount_rw" != true && "$mount_rw" != false ]]; then
                  malformed=1
                  continue
                fi
                local type_bind=false metadata_present=false metadata_source_match=false
                [[ "$mount_type" == bind ]] && type_bind=true
                [[ -n "$expected_source" ]] && metadata_present=true
                [[ "$metadata_present" == true && "$mount_source" == "$expected_source" ]] && metadata_source_match=true
                [[ "$type_bind" == true && "$metadata_source_match" == true ]] || invalid=1
                case "$id" in
                  etc_hosts) hosts_type="$type_bind"; hosts_present="$metadata_present"; hosts_match="$metadata_source_match"; hosts_rw="$mount_rw" ;;
                  etc_hostname) hostname_type="$type_bind"; hostname_present="$metadata_present"; hostname_match="$metadata_source_match"; hostname_rw="$mount_rw" ;;
                  etc_resolv_conf) resolv_type="$type_bind"; resolv_present="$metadata_present"; resolv_match="$metadata_source_match"; resolv_rw="$mount_rw" ;;
                esac
              done <<< "$entries"
              (( hosts_seen == 1 && hostname_seen == 1 && resolv_seen == 1 )) || invalid=1
              (( hosts_seen <= 1 && hostname_seen <= 1 && resolv_seen <= 1 )) || invalid=1
              # readonly_rootfs is deliberately reported but is not used to
              # infer bind-mount writability.
              printf 'docker_special_file id=etc_hosts cardinality_one=%s type_bind=%s metadata_present=%s metadata_source_match=%s mount_rw=%s readonly_rootfs=%s\n' \
                "$([[ "$hosts_seen" == 1 ]] && printf true || printf false)" "$hosts_type" "$hosts_present" "$hosts_match" "$hosts_rw" "$readonly_rootfs"
              printf 'docker_special_file id=etc_hostname cardinality_one=%s type_bind=%s metadata_present=%s metadata_source_match=%s mount_rw=%s readonly_rootfs=%s\n' \
                "$([[ "$hostname_seen" == 1 ]] && printf true || printf false)" "$hostname_type" "$hostname_present" "$hostname_match" "$hostname_rw" "$readonly_rootfs"
              printf 'docker_special_file id=etc_resolv_conf cardinality_one=%s type_bind=%s metadata_present=%s metadata_source_match=%s mount_rw=%s readonly_rootfs=%s\n' \
                "$([[ "$resolv_seen" == 1 ]] && printf true || printf false)" "$resolv_type" "$resolv_present" "$resolv_match" "$resolv_rw" "$readonly_rootfs"
              printf 'docker_special_file_unexpected_count=%s\n' "$unexpected"
              if (( malformed != 0 )); then
                printf '%s\n' 'docker_special_file_parser_error'
                return 2
              fi
              (( unexpected == 0 && invalid == 0 )) || return 1
              return 0
            }
            # DOCKER_SPECIAL_FILES_DIAGNOSTIC_END
            if ! docker_reported_mounts="$(inspect_value '{{range .Mounts}}{{printf "%s|%s|%t\n" .Type .Destination .RW}}{{end}}')"; then
              fail 'docker inspect failed for reported mounts'
            else
              set +e
              docker_reported_mount_diagnostic="$(validate_docker_reported_mounts "$docker_reported_mounts")"
              docker_reported_mount_rc=$?
              set -e
              while IFS= read -r docker_reported_mount_line; do
                [[ -n "$docker_reported_mount_line" ]] && info "$docker_reported_mount_line"
              done <<< "$docker_reported_mount_diagnostic"
              case "$docker_reported_mount_rc" in
                0) pass 'docker reported mounts match closed allowlist' ;;
                1) fail 'docker reported unexpected mount' ;;
                *) fail 'docker reported mounts parser failed' ;;
              esac
            fi
            # Keep sources private: these values are used only for equality
            # checks against the .Mounts report from this same container.
            # This is an evidence-only correlation.  Docker does not promise
            # that its generated /etc files appear in .Mounts while a
            # container is merely created.  An inconclusive result is recorded
            # as NO-GO, but does not override mandatory pre-start controls or
            # suppress runtime evidence collection.
            if ! docker_special_mounts="$(inspect_value '{{range .Mounts}}{{printf "%s|%s|%t|%s\n" .Destination .Type .RW .Source}}{{end}}')" || \
               ! docker_hosts_path="$(inspect_value '{{.HostsPath}}')" || \
               ! docker_hostname_path="$(inspect_value '{{.HostnamePath}}')" || \
               ! docker_resolv_path="$(inspect_value '{{.ResolvConfPath}}')" || \
               ! docker_readonly_rootfs="$(inspect_value '{{.HostConfig.ReadonlyRootfs}}')"; then
              record_docker_special_correlation_result inspect_error
            else
              set +e
              docker_special_diagnostic="$(diagnose_docker_special_files "$docker_special_mounts" "$docker_hosts_path" "$docker_hostname_path" "$docker_resolv_path" "$docker_readonly_rootfs")"
              docker_special_rc=$?
              set -e
              while IFS= read -r docker_special_line; do
                [[ -n "$docker_special_line" ]] && info "$docker_special_line"
              done <<< "$docker_special_diagnostic"
              record_docker_special_correlation_result "$docker_special_rc"
            fi
          fi

          diagnostic_rc=99
          if runtime_collection_permitted; then
            if ! diagnostic_log="$(mktemp)"; then
              fail 'cannot create trusted host diagnostic log'
            fi
          fi
          if runtime_collection_permitted; then
            # The heredoc is trusted workflow text.  It is the only payload
            # executed inside the isolated container.
            set +e
            docker start --attach --interactive "$container_id" >"$diagnostic_log" 2>&1 <<'DIAGNOSTIC'
          set -Eeuo pipefail
          bad=0
          probe_pass() { printf 'PASS %s\n' "$1"; }
          probe_fail() { printf 'FAIL %s\n' "$1"; bad=1; }
          verify() { local name="$1"; shift; if "$@"; then probe_pass "$name"; else probe_fail "$name"; fi; }

          for tool in bash openssl curl nc getent ip awk grep find readlink timeout id cat stat; do
            command -v "$tool" >/dev/null 2>&1 || probe_fail "required_tool_missing_${tool}"
          done

          verify uid_is_non_root test "$(id -u)" -eq 10001
          verify gid_is_non_root test "$(id -g)" -eq 10001
          verify no_supplementary_groups bash -c 'test "$(id -G | wc -w)" -eq 1'
          verify no_new_privileges grep -q '^NoNewPrivs:[[:space:]]*1$' /proc/self/status
          for cap in CapInh CapPrm CapEff CapBnd CapAmb; do
            verify "${cap}_is_zero" grep -q "^${cap}:[[:space:]]*0000000000000000$" /proc/self/status
          done

          verify root_filesystem_is_read_only awk '
            $5 == "/" { n=split($6, opts, ","); for (i=1; i<=n; i++) if (opts[i] == "ro") ok=1 }
            END { exit !ok }
          ' /proc/self/mountinfo
          verify tmpfs_tmp_is_writable bash -c 'touch /tmp/preflight-write-test && rm /tmp/preflight-write-test'
          verify cgroup_memory_lte_512MiB bash -c 'v=$(cat /sys/fs/cgroup/memory.max) && [[ "$v" =~ ^[0-9]+$ && "$v" -gt 0 && "$v" -le 536870912 ]]'
          verify cgroup_pids_lte_128 bash -c 'v=$(cat /sys/fs/cgroup/pids.max) && [[ "$v" =~ ^[0-9]+$ && "$v" -gt 0 && "$v" -le 128 ]]'
          verify cgroup_cpu_lte_one_core bash -c 'read -r quota period < /sys/fs/cgroup/cpu.max && [[ "$quota" =~ ^[0-9]+$ && "$quota" -gt 0 && "$period" =~ ^[0-9]+$ && "$period" -gt 0 && "$quota" -le "$period" ]]'

          for ns in mnt pid net ipc uts cgroup user; do
            [[ -e "/proc/self/ns/$ns" ]] && printf 'INFO namespace_%s=%s\n' "$ns" "$(readlink "/proc/self/ns/$ns")" || probe_fail "namespace_missing_${ns}"
          done
          verify only_loopback_interface bash -c 'links=$(ip -o link show) || exit 2; test "$(printf "%s\n" "$links" | wc -l)" -eq 1 && printf "%s\n" "$links" | grep -Eq "^[0-9]+: lo:"'
          verify_no_default_route() {
            local family="$1" routes route_rc
            routes=$(mktemp) || { probe_fail "ipv${family}_route_tempfile_failed"; return; }
            set +e
            ip "-$family" route show default >"$routes" 2>&1
            route_rc=$?
            set -e
            case "$route_rc" in
              0)
                if [[ -s "$routes" ]]; then
                  probe_fail "ipv${family}_default_route_present"
                else
                  probe_pass "ipv${family}_no_default_route"
                fi
                ;;
              *) probe_fail "ipv${family}_route_query_failed_rc_${route_rc}" ;;
            esac
            rm -f "$routes"
          }
          verify_no_default_route 4
          verify_no_default_route 6

          # SOCKET_SCAN_CLASSIFIER_BEGIN
          classify_socket_scan() {
            local scan_rc="$1" stderr_file="$2" result_file="$3"
            if (( scan_rc != 0 )); then
              if grep -Eq 'Permission denied|Operation not permitted' "$stderr_file"; then
                printf 'socket_scan_incomplete_permission_rc_%s\n' "$scan_rc"
              elif (( scan_rc == 127 )); then
                printf '%s\n' socket_scan_tool_unavailable
              else
                printf 'socket_scan_incomplete_tool_or_io_rc_%s\n' "$scan_rc"
              fi
              return 1
            fi
            if [[ -s "$stderr_file" ]]; then
              printf '%s\n' socket_scan_stderr_without_failure
              return 1
            fi
            if [[ -s "$result_file" ]]; then
              printf '%s\n' host_control_socket_candidate_found
              return 1
            fi
            printf '%s\n' socket_scan_complete_no_candidates
            return 0
          }
          # SOCKET_SCAN_CLASSIFIER_END

          # The socket scan is deliberately restricted to traversable container
          # locations. An all-filesystem scan as UID 10001 is incomplete on
          # pseudo-filesystems and therefore cannot prove absence. This scope is
          # paired with the closed mount allowlist and direct path checks below.
          socket_bad=0
          for socket in /var/run/docker.sock /run/docker.sock /var/run/containerd/containerd.sock /run/containerd/containerd.sock /var/run/podman/podman.sock /run/podman/podman.sock; do
            [[ ! -e "$socket" && ! -S "$socket" ]] || socket_bad=1
          done
          socket_scan=$(mktemp) || { probe_fail socket_scan_setup_failed; socket_bad=1; }
          socket_scan_err=$(mktemp) || { probe_fail socket_scan_errorlog_setup_failed; socket_bad=1; }
          if (( socket_bad == 0 )); then
            socket_scan_scope_inaccessible=0
            for socket_root in /tmp /run /var/run /dev /etc; do
              [[ -d "$socket_root" && -r "$socket_root" && -x "$socket_root" ]] || socket_scan_scope_inaccessible=1
            done
            if (( socket_scan_scope_inaccessible != 0 )); then
              probe_fail socket_scan_scope_inaccessible
              socket_bad=1
            else
              set +e
              find /tmp /run /var/run /dev /etc -xdev -type s \( -name '*docker*.sock' -o -name '*containerd*.sock' -o -name '*podman*.sock' \) -print >"$socket_scan" 2>"$socket_scan_err"
              socket_scan_rc=$?
              set -e
              set +e
              socket_scan_diagnostic="$(classify_socket_scan "$socket_scan_rc" "$socket_scan_err" "$socket_scan")"
              socket_scan_status=$?
              set -e
              if (( socket_scan_status == 0 )); then
                probe_pass "$socket_scan_diagnostic"
              else
                probe_fail "$socket_scan_diagnostic"
                socket_bad=1
              fi
            fi
          fi
          rm -f "${socket_scan:-}" "${socket_scan_err:-}"
          (( socket_bad == 0 )) && probe_pass no_host_control_socket || probe_fail host_control_socket_or_scan_failure
          # Exit status is deliberately tri-state: 0 = valid/allowed, 1 =
          # forbidden exposure, 2+ = unreadable or malformed mountinfo.
          set +e
          awk '
            # MOUNTINFO_AWK_BEGIN
            function has_option(options, wanted, n, values, i) {
              n = split(options, values, ",")
              for (i = 1; i <= n; i++) if (values[i] == wanted) return 1
              return 0
            }
            function is_ro(options) { return has_option(options, "ro") && !has_option(options, "rw") }
            function is_rw(options) { return has_option(options, "rw") && !has_option(options, "ro") }
            function is_proc_readonly_path(path) {
              return path == "/proc/bus" || path == "/proc/fs" || path == "/proc/irq" || \
                     path == "/proc/sys" || path == "/proc/sysrq-trigger"
            }
            function is_masked_proc_path(path) {
              return path == "/proc/acpi" || path == "/proc/asound" || path == "/proc/scsi" || \
                     path == "/proc/interrupts" || path == "/proc/kcore" || path == "/proc/keys" || \
                     path == "/proc/latency_stats" || path == "/proc/timer_list" || path == "/proc/timer_stats"
            }
            function expected_path(path) {
              return path == "/" || path == "/proc" || is_proc_readonly_path(path) || is_masked_proc_path(path) || \
                     path == "/dev" || path == "/dev/pts" || path == "/dev/mqueue" || path == "/dev/shm" || \
                     path == "/sys" || path == "/sys/fs/cgroup" || path == "/sys/firmware" || path == "/sys/devices/virtual/powercap" || \
                     path == "/tmp" || path == "/run" || path == "/etc/hosts" || path == "/etc/hostname" || path == "/etc/resolv.conf"
            }
            function destination_class(path) {
              if (expected_path(path)) return "expected"
              if (path ~ /^\/proc(\/|$)/) return "proc_descendant"
              if (path ~ /^\/sys(\/|$)/) return "sys_descendant"
              if (path ~ /^\/dev(\/|$)/) return "dev_descendant"
              if (path ~ /^\/etc(\/|$)/) return "etc_other"
              return "other"
            }
            function destination_id(path) {
              if (path == "/") return "root_overlay"
              if (path == "/proc") return "proc_root"
              if (path == "/proc/bus") return "proc_bus"
              if (path == "/proc/fs") return "proc_fs"
              if (path == "/proc/irq") return "proc_irq"
              if (path == "/proc/sys") return "proc_sys"
              if (path == "/proc/sysrq-trigger") return "proc_sysrq"
              if (path == "/proc/acpi") return "proc_acpi"
              if (path == "/proc/asound") return "proc_asound"
              if (path == "/proc/scsi") return "proc_scsi"
              if (path == "/proc/interrupts") return "proc_interrupts"
              if (path == "/proc/kcore") return "proc_kcore"
              if (path == "/proc/keys") return "proc_keys"
              if (path == "/proc/latency_stats") return "proc_latency_stats"
              if (path == "/proc/timer_list") return "proc_timer_list"
              if (path == "/proc/timer_stats") return "proc_timer_stats"
              if (path == "/dev") return "dev_root"
              if (path == "/dev/pts") return "dev_pts"
              if (path == "/dev/mqueue") return "dev_mqueue"
              if (path == "/dev/shm") return "dev_shm"
              if (path == "/sys") return "sys_root"
              if (path == "/sys/fs/cgroup") return "sys_cgroup"
              if (path == "/sys/firmware") return "sys_firmware"
              if (path == "/sys/devices/virtual/powercap") return "sys_powercap"
              if (path == "/tmp") return "tmp"
              if (path == "/run") return "run"
              if (path == "/etc/hosts") return "etc_hosts"
              if (path == "/etc/hostname") return "etc_hostname"
              if (path == "/etc/resolv.conf") return "etc_resolv_conf"
              return "none"
            }
            function known_fstype_category(value) {
              return value == "overlay" || value == "proc" || value == "tmpfs" || value == "devpts" || value == "mqueue" || value == "sysfs" || value == "cgroup2" ? value : "other"
            }
            function known_source_category(value) {
              return value == "overlay" || value == "proc" || value == "tmpfs" || value == "devpts" || value == "mqueue" || value == "shm" || value == "sysfs" || value == "cgroup" ? value : "other"
            }
            function identity_matches(path, filesystem, source) {
              if (path == "/") return filesystem == "overlay" && source == "overlay"
              if (path == "/proc" || is_proc_readonly_path(path)) return filesystem == "proc" && source == "proc"
              if (is_masked_proc_path(path) || path == "/dev" || path == "/sys/firmware" || path == "/sys/devices/virtual/powercap" || path == "/tmp" || path == "/run" || path == "/etc/hosts" || path == "/etc/hostname" || path == "/etc/resolv.conf") return filesystem == "tmpfs" && source == "tmpfs"
              if (path == "/dev/pts") return filesystem == "devpts" && source == "devpts"
              if (path == "/dev/mqueue") return filesystem == "mqueue" && source == "mqueue"
              if (path == "/dev/shm") return filesystem == "tmpfs" && source == "shm"
              if (path == "/sys") return filesystem == "sysfs" && source == "sysfs"
              if (path == "/sys/fs/cgroup") return filesystem == "cgroup2" && source == "cgroup"
              return 0
            }
            function expected_access(path) {
              if (path == "/" || is_proc_readonly_path(path) || is_masked_proc_path(path) || path == "/sys" || path == "/sys/fs/cgroup" || path == "/sys/firmware" || path == "/sys/devices/virtual/powercap") return "ro"
              return "rw"
            }
            function requires_option(path, option) {
              if (option == "nosuid") return path != "/" && !(path == "/etc/hosts" || path == "/etc/hostname" || path == "/etc/resolv.conf")
              if (option == "nodev") return path == "/proc" || is_proc_readonly_path(path) || is_masked_proc_path(path) || path == "/dev/mqueue" || path == "/dev/shm" || path == "/sys" || path == "/sys/fs/cgroup" || path == "/sys/firmware" || path == "/sys/devices/virtual/powercap"
              if (option == "noexec") return path == "/proc" || is_proc_readonly_path(path) || is_masked_proc_path(path) || path == "/dev/pts" || path == "/dev/mqueue" || path == "/dev/shm" || path == "/sys" || path == "/sys/fs/cgroup" || path == "/sys/firmware" || path == "/sys/devices/virtual/powercap" || path == "/tmp" || path == "/run"
              return 0
            }
            function per_mount_option_code(path, options, code, access) {
              code = ""
              access = expected_access(path)
              if ((access == "ro" && !is_ro(options)) || (access == "rw" && !is_rw(options))) code = "access_" access "_required"
              if (requires_option(path, "nosuid") && !has_option(options, "nosuid")) code = code (code ? "+" : "") "missing_nosuid"
              if (requires_option(path, "nodev") && !has_option(options, "nodev")) code = code (code ? "+" : "") "missing_nodev"
              if (requires_option(path, "noexec") && !has_option(options, "noexec")) code = code (code ? "+" : "") "missing_noexec"
              return code == "" ? "none" : code
            }
            function superblock_access_category(options) {
              if (has_option(options, "ro") && has_option(options, "rw")) return "conflict"
              if (has_option(options, "ro")) return "ro"
              if (has_option(options, "rw")) return "rw"
              return "other"
            }
            function options_match(path, options) { return per_mount_option_code(path, options) == "none" }
            function report_rejection(reason, path, filesystem, source, options, super_options, id) {
              id = expected_path(path) ? destination_id(path) : "none"
              printf "INFO mountinfo_reject reason=%s destination_class=%s", reason, destination_class(path)
              if (id != "none") printf " destination_id=%s", id
              if (reason == "filesystem_or_source_incompatible") printf " fstype_category=%s source_category=%s", known_fstype_category(filesystem), known_source_category(source)
              if (reason == "mount_options_incompatible") printf " per_mount=%s superblock_access=%s", per_mount_option_code(path, options), superblock_access_category(super_options)
              printf "\n"
              rejected++
            }
            {
              records++
              if (NF < 7) { malformed = 1; report_rejection("format_invalid", "", "", "", "", ""); next }
              separator = 0
              for (i = 7; i <= NF; i++) if ($i == "-") { separator = i; break }
              if (!separator || separator + 3 > NF) { malformed = 1; report_rejection("format_invalid", "", "", "", "", ""); next }
              target = $5; options = $6; filesystem = $(separator + 1); source = $(separator + 2); super_options = $(separator + 3)
              if (seen[target]++) { forbidden = 1; report_rejection("duplicate_destination", target, filesystem, source, options, super_options) }
              if (!expected_path(target)) {
                forbidden = 1
                report_rejection("destination_not_allowlisted", target, filesystem, source, options, super_options)
              } else if (!identity_matches(target, filesystem, source)) {
                forbidden = 1
                report_rejection("filesystem_or_source_incompatible", target, filesystem, source, options, super_options)
              } else if (!options_match(target, options)) {
                forbidden = 1
                report_rejection("mount_options_incompatible", target, filesystem, source, options, super_options)
              }
              if (target ~ /(^|\/)(docker|containerd|podman)\.sock$/ || \
                  target ~ /^\/(home\/runner|__w|github)(\/|$)/ || \
                  source ~ /(docker\.sock|containerd\.sock|podman\.sock|\/home\/runner|\/__w|\/github)/) {
                forbidden = 1
                report_rejection("forbidden_host_reference", target, filesystem, source, options, super_options)
              }
            }
            END {
              if (records == 0) { printf "%s\n", "INFO mountinfo_reject reason=empty destination_class=none"; exit 2 }
              if (malformed) exit 2
              if (forbidden) exit 1
              exit 0
            }
            # MOUNTINFO_AWK_END
          ' /proc/self/mountinfo
          mountinfo_rc=$?
          set -e
          case "$mountinfo_rc" in
            0) probe_pass runtime_mountinfo_closed_allowlist ;;
            1) probe_fail prohibited_or_unexpected_runtime_mount ;;
            *) probe_fail "mountinfo_inspection_error_rc_${mountinfo_rc}" ;;
          esac

          # The following probes explain known runtime mask representations;
          # they do not modify the closed mount allowlist above.  All raw
          # mountinfo fields stay inside awk/shell variables.
          # RUNTIME_MASK_DIAGNOSTIC_AWK_BEGIN
          runtime_mask_diagnostic_awk='\
            BEGIN {
              dir_paths["proc_acpi"] = "/proc/acpi"
              dir_paths["proc_scsi"] = "/proc/scsi"
              dir_paths["sys_firmware"] = "/sys/firmware"
            }
            function option(options, wanted, n, values, i) {
              n = split(options, values, ",")
              for (i = 1; i <= n; i++) if (values[i] == wanted) return 1
              return 0
            }
            function ro(options) { return option(options, "ro") && !option(options, "rw") }
            function rw(options) { return option(options, "rw") && !option(options, "ro") }
            function dir_id(path) {
              if (path == "/proc/acpi") return "proc_acpi"
              if (path == "/proc/scsi") return "proc_scsi"
              if (path == "/sys/firmware") return "sys_firmware"
              return ""
            }
            function file_id(path) {
              if (path == "/proc/interrupts") return "proc_interrupts"
              if (path == "/proc/kcore") return "proc_kcore"
              if (path == "/proc/keys") return "proc_keys"
              if (path == "/proc/latency_stats") return "proc_latency_stats"
              if (path == "/proc/timer_list") return "proc_timer_list"
              return ""
            }
            function propagation_clear(first, last, i) {
              for (i = first; i <= last; i++)
                if ($i ~ /^(shared:|master:|propagate_from:|unbindable$)/) return "false"
              return "true"
            }
            function bool(value) { return value ? "true" : "false" }
            function report_dir(id, path, fs, source, root, options, propagation) {
              dir_seen[id]++
              dir_fs[id] = bool(fs == "tmpfs" && source == "tmpfs")
              dir_root[id] = bool(root == "/")
              dir_ro[id] = bool(ro(options))
              dir_propagation[id] = propagation
            }
            function report_file(id, path, fs, source, root, options, propagation) {
              file_seen[id]++
              file_fs[id] = bool(fs == "tmpfs" && source == "tmpfs")
              file_root[id] = bool(root == "/null")
              file_rw[id] = bool(rw(options))
              file_propagation[id] = propagation
            }
            {
              records++
              if (NF < 7) { malformed = 1; next }
              separator = 0
              for (i = 7; i <= NF; i++) if ($i == "-") { separator = i; break }
              if (!separator || separator + 3 > NF) { malformed = 1; next }
              root = $4; target = $5; options = $6; fs = $(separator + 1); source = $(separator + 2)
              propagation = propagation_clear(7, separator - 1)
              id = dir_id(target)
              if (id != "") report_dir(id, target, fs, source, root, options, propagation)
              id = file_id(target)
              if (id != "") report_file(id, target, fs, source, root, options, propagation)
              for (d in dir_paths) if (target ~ ("^" dir_paths[d] "/")) dir_submount[d] = "true"
            }
            END {
              split("proc_acpi proc_scsi sys_firmware", dirs, " ")
              split("proc_interrupts proc_kcore proc_keys proc_latency_stats proc_timer_list", files, " ")
              if (records == 0 || malformed) { print "runtime_mask_mountinfo_parser_error"; exit 2 }
              bad = 0
              for (i in dirs) {
                id = dirs[i]; seen = dir_seen[id] == 1 ? "true" : "false"
                submount = dir_submount[id] == "true" ? "true" : "false"
                printf "runtime_mask_directory id=%s cardinality_one=%s type_source_tmpfs=%s root_is_slash=%s per_mount_ro=%s propagation_markers_absent=%s submounts_unexpected=%s\n", id, seen, dir_fs[id] ? dir_fs[id] : "false", dir_root[id] ? dir_root[id] : "false", dir_ro[id] ? dir_ro[id] : "false", dir_propagation[id] ? dir_propagation[id] : "false", submount
                if (seen != "true" || submount != "false" || dir_fs[id] != "true" || dir_root[id] != "true" || dir_ro[id] != "true" || dir_propagation[id] != "true") bad = 1
              }
              for (i in files) {
                id = files[i]; seen = file_seen[id] == 1 ? "true" : "false"
                printf "runtime_mask_file id=%s cardinality_one=%s type_source_tmpfs=%s root_is_null=%s per_mount_rw=%s propagation_markers_absent=%s\n", id, seen, file_fs[id] ? file_fs[id] : "false", file_root[id] ? file_root[id] : "false", file_rw[id] ? file_rw[id] : "false", file_propagation[id] ? file_propagation[id] : "false"
                if (seen != "true" || file_fs[id] != "true" || file_root[id] != "true" || file_rw[id] != "true" || file_propagation[id] != "true") bad = 1
              }
              exit bad ? 1 : 0
            }'
          # RUNTIME_MASK_DIAGNOSTIC_AWK_END
          # RUNTIME_OBJECT_DIAGNOSTIC_BEGIN
          diagnose_masked_directory_objects() {
            local entries="$1" id path extra listing error_file find_rc
            local invalid=0 parse_error=0
            while IFS='|' read -r id path extra; do
              [[ -z "$id" && -z "$path" && -z "$extra" ]] && continue
              if [[ -z "$id" || -z "$path" || -n "$extra" ]]; then parse_error=1; continue; fi
              # Production supplies the fixed paths below; this helper keeps
              # the ID closed so fixtures can exercise its object checks
              # without emitting their temporary paths.
              case "$id" in
                proc_acpi|proc_scsi|sys_firmware) ;;
                *) parse_error=1; continue ;;
              esac
              local object_dir=false object_symlink=false empty=false inspection_complete=false
              [[ -L "$path" ]] && object_symlink=true
              [[ -d "$path" && "$object_symlink" == false ]] && object_dir=true
              if [[ "$object_dir" == true ]]; then
                error_file="$(mktemp)" || { parse_error=1; continue; }
                set +e
                listing="$(find "$path" -xdev -mindepth 1 -maxdepth 1 -print -quit 2>"$error_file")"
                find_rc=$?
                set -e
                if (( find_rc == 0 )) && [[ ! -s "$error_file" ]]; then
                  inspection_complete=true
                  [[ -z "$listing" ]] && empty=true
                fi
                rm -f "$error_file"
              fi
              [[ "$object_dir" == true && "$object_symlink" == false && "$empty" == true && "$inspection_complete" == true ]] || invalid=1
              printf 'runtime_mask_directory_object id=%s object_dir=%s object_symlink=%s empty=%s inspection_complete=%s\n' "$id" "$object_dir" "$object_symlink" "$empty" "$inspection_complete"
            done <<< "$entries"
            if (( parse_error != 0 )); then printf '%s\n' runtime_mask_directory_object_parser_error; return 2; fi
            (( invalid == 0 )) || return 1
          }

          diagnose_masked_file_objects() {
            local entries="$1" id path extra details null_details object_type major minor null_type null_major null_minor
            local invalid=0 parse_error=0
            if ! null_details="$(stat -Lc '%F|%t|%T' /dev/null)"; then
              printf '%s\n' runtime_mask_file_null_stat_error
              return 2
            fi
            IFS='|' read -r null_type null_major null_minor <<< "$null_details"
            while IFS='|' read -r id path extra; do
              [[ -z "$id" && -z "$path" && -z "$extra" ]] && continue
              if [[ -z "$id" || -z "$path" || -n "$extra" ]]; then parse_error=1; continue; fi
              # Production supplies the fixed paths below; only known IDs are
              # accepted and the inspected path is never logged.
              case "$id" in
                proc_interrupts|proc_kcore|proc_keys|proc_latency_stats|proc_timer_list) ;;
                *) parse_error=1; continue ;;
              esac
              local character_device=false object_symlink=false null_1_3=false null_identity_match=false inspection_complete=false
              [[ -L "$path" ]] && object_symlink=true
              if details="$(stat -Lc '%F|%t|%T' "$path" 2>/dev/null)"; then
                IFS='|' read -r object_type major minor <<< "$details"
                inspection_complete=true
                [[ "$object_type" == 'character special file' ]] && character_device=true
                [[ "$major" == 1 && "$minor" == 3 && "$null_type" == 'character special file' && "$null_major" == 1 && "$null_minor" == 3 ]] && null_1_3=true
                [[ "$details" == "$null_details" ]] && null_identity_match=true
              fi
              [[ "$character_device" == true && "$object_symlink" == false && "$null_1_3" == true && "$null_identity_match" == true && "$inspection_complete" == true ]] || invalid=1
              printf 'runtime_mask_file_object id=%s character_device=%s object_symlink=%s null_char_1_3=%s null_identity_match=%s inspection_complete=%s\n' "$id" "$character_device" "$object_symlink" "$null_1_3" "$null_identity_match" "$inspection_complete"
            done <<< "$entries"
            if (( parse_error != 0 )); then printf '%s\n' runtime_mask_file_object_parser_error; return 2; fi
            (( invalid == 0 )) || return 1
          }
          # RUNTIME_OBJECT_DIAGNOSTIC_END
          # The awk probe must have a complete view: malformed input and every
          # unrecognised descendant of a masked directory are NO-GO.
          set +e
          runtime_mask_mount_diagnostic="$(awk "$runtime_mask_diagnostic_awk" /proc/self/mountinfo)"
          runtime_mask_mount_rc=$?
          set -e
          while IFS= read -r runtime_mask_line; do
            [[ -n "$runtime_mask_line" ]] && printf 'INFO %s\n' "$runtime_mask_line"
          done <<< "$runtime_mask_mount_diagnostic"
          case "$runtime_mask_mount_rc" in
            0) printf '%s\n' 'INFO runtime_mask_mount_diagnostic_complete_not_authorization' ;;
            1) probe_fail runtime_mask_mount_diagnostic_inconclusive_or_mismatch ;;
            *) probe_fail runtime_mask_mount_diagnostic_parser_error ;;
          esac
          set +e
          runtime_mask_dir_diagnostic="$(diagnose_masked_directory_objects $'proc_acpi|/proc/acpi\nproc_scsi|/proc/scsi\nsys_firmware|/sys/firmware')"
          runtime_mask_dir_rc=$?
          runtime_mask_file_diagnostic="$(diagnose_masked_file_objects $'proc_interrupts|/proc/interrupts\nproc_kcore|/proc/kcore\nproc_keys|/proc/keys\nproc_latency_stats|/proc/latency_stats\nproc_timer_list|/proc/timer_list')"
          runtime_mask_file_rc=$?
          set -e
          while IFS= read -r runtime_mask_line; do [[ -n "$runtime_mask_line" ]] && printf 'INFO %s\n' "$runtime_mask_line"; done <<< "$runtime_mask_dir_diagnostic"
          while IFS= read -r runtime_mask_line; do [[ -n "$runtime_mask_line" ]] && printf 'INFO %s\n' "$runtime_mask_line"; done <<< "$runtime_mask_file_diagnostic"
          case "$runtime_mask_dir_rc" in 0) printf '%s\n' 'INFO runtime_mask_directory_object_diagnostic_complete_not_authorization' ;; 1) probe_fail runtime_mask_directory_object_diagnostic_inconclusive_or_mismatch ;; *) probe_fail runtime_mask_directory_object_diagnostic_parser_error ;; esac
          case "$runtime_mask_file_rc" in 0) printf '%s\n' 'INFO runtime_mask_file_object_diagnostic_complete_not_authorization' ;; 1) probe_fail runtime_mask_file_object_diagnostic_inconclusive_or_mismatch ;; *) probe_fail runtime_mask_file_object_diagnostic_parser_error ;; esac

          # --network none plus one loopback interface is primary evidence.
          # DNS, raw TCP and TLS/HTTPS attempts are independent negative probes.
          timeout 5 getent ahostsv4 example.com >/dev/null 2>&1 && probe_fail dns_egress_available || probe_pass dns_negative
          timeout 5 nc -z -w 3 1.1.1.1 443 >/dev/null 2>&1 && probe_fail tcp_egress_available || probe_pass tcp_negative
          timeout 5 openssl s_client -connect 1.1.1.1:443 -servername one.one.one.one -brief </dev/null >/dev/null 2>&1 && probe_fail tls_egress_available || probe_pass tls_negative
          HTTPS_PROXY= HTTP_PROXY= ALL_PROXY= NO_PROXY= timeout 5 curl --noproxy '*' --insecure --silent --show-error --output /dev/null https://1.1.1.1/ >/dev/null 2>&1 && probe_fail https_egress_available || probe_pass https_negative

          (( bad == 0 )) || exit 86
          printf '%s\n' 'PAPERCLIP_PREFLIGHT_DIAGNOSTIC_COMPLETE'
          DIAGNOSTIC
            start_rc=$?
            set -e
            cat "$diagnostic_log"
            if ! diagnostic_rc="$(inspect_value '{{.State.ExitCode}}')"; then
              fail 'docker inspect failed for diagnostic exit code'
            fi
            if ! diagnostic_state="$(inspect_value '{{.State.Status}}')"; then
              fail 'docker inspect failed for diagnostic state'
            fi
            [[ "$start_rc" == 0 ]] || fail "docker start returned non-zero: $start_rc"
            [[ "$diagnostic_state" == exited ]] || fail "diagnostic container state is not exited: $diagnostic_state"
            [[ "$diagnostic_rc" == 0 ]] || fail "diagnostic container exit code is not zero: $diagnostic_rc"
            [[ "$(grep -Fxc 'PAPERCLIP_PREFLIGHT_DIAGNOSTIC_COMPLETE' "$diagnostic_log")" == 1 ]] || fail 'diagnostic completion marker missing or duplicated'
            [[ "$(tail -n 1 "$diagnostic_log")" == PAPERCLIP_PREFLIGHT_DIAGNOSTIC_COMPLETE ]] || fail 'diagnostic completion marker is not final output'
          fi

          summary_payload="$({
            echo '## Paperclip TI-0093 isolation preflight v2'
            echo
            echo '- No Paperclip source, packages, models, third-party repository scripts or private data were accessed.'
            echo '- The runner used Docker only to create the separately configured diagnostic container.'
            echo '- The summary is written by the trusted runner process, not the UID 10001 container process.'
            echo '- A pass validates only this diagnostic configuration; it does not authorize P01, P02 or P04.'
            echo
            if final_verdict_is_go; then
              echo '### Verdict: GO for separate review of a later Paperclip test workflow only'
              echo '- P01/P02/P04 remain NO-GO pending explicit approval and a separately reviewed workflow.'
            else
              echo '### Verdict: NO-GO'
              printf -- '- %s\n' "${hard_prestart_failures[@]}" "${diagnostic_findings[@]}"
            fi
          })"
          if ! printf '%s\n' "$summary_payload" >> "$GITHUB_STEP_SUMMARY"; then
            fail 'cannot write GITHUB_STEP_SUMMARY from trusted runner process'
          fi

          # Fail the job for any mandatory failure or diagnostic NO-GO.
          final_verdict_is_go
